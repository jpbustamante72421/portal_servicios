
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Portal de Servicios{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <!-- BARRA DE NAVEGACION -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">Portal de Servicios</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/compra">Compra</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/salario">Salario</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/temperatura">Temperatura</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/empresa">Empresa</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/servicios">Servicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contacto">Contacto</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4">

        {% block contenido %}

        {% endblock %}

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        Portal de Servicios | Desarrollo de Aplicaciones Web
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
