
{% extends 'base.html' %}

{% block titulo %}Inicio | Portal de Servicios{% endblock %}

{% block contenido %}

<div class="text-center mb-4">

    <h1>Bienvenido al Portal de Servicios</h1>

    <p class="lead">
        Un espacio donde encontrarás herramientas y servicios
        para facilitar tus actividades.
    </p>

</div>

<!-- CARRUSEL -->
<div id="carrusel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='img/imagen1.jpg') }}"
                 class="d-block w-100" alt="Servicio 1">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/imagen2.jpg') }}"
                 class="d-block w-100" alt="Servicio 2">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/imagen3.jpg') }}"
                 class="d-block w-100" alt="Servicio 3">
        </div>

    </div>

    <button class="carousel-control-prev" type="button"
        data-bs-target="#carrusel" data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next" type="button"
        data-bs-target="#carrusel" data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>

{% endblock %}
